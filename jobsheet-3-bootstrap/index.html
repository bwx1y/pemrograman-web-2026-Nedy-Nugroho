<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goods Office</title>
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <nav class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 250px; min-height: 100vh;">
        <h2 class="fs-4 text-center mb-4">Goods Office</h2>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item"><a href="#" class="nav-link active">Home</a></li>
            <li class="nav-item"><a href="./item" class="nav-link text-white">List of Items</a></li>
            <li class="nav-item"><a href="./user" class="nav-link text-white">Daftar Anggota</a></li>
        </ul>
    </nav>

    <!-- Content -->
    <main class="flex-grow-1 p-4">
        <h1>Dashboard Pendataan Barang</h1>
        <p>Selamat datang di sistem informasi pendataan barang inventaris.</p>

        <div class="row mt-4">
            <div class="col-md-4 mb-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">Jumlah Barang</h5>
                        <p class="display-6 fw-bold">1.250</p>
                        <p class="card-text">Total item tercatat</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">Jumlah Pengguna</h5>
                        <p class="display-6 fw-bold">45</p>
                        <p class="card-text">Admin &amp; Staff aktif</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-white bg-danger">
                    <div class="card-body">
                        <h5 class="card-title">Jumlah Kategori</h5>
                        <p class="display-6 fw-bold">12</p>
                        <p class="card-text">Total Kategori tercatat</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="./assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
