<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goods Office</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="container">
    <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
    <aside class="sidebar">
        <h2>Goods Office</h2>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../item/index.html">List of Items</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="../user/index.html">Members</a></li>
        </ul>
    </aside>

    <main class="content">
        <!-- Wrapper for Title and Add Button -->
        <div class="content-header">
            <h1>Categories</h1>
            <a href="add.html" class="btn-add">+ Add Category</a>
        </div>

        <div class="search-box">
            <label for="search-input">Cari Kategori</label>
            <input type="text" id="search-input" placeholder="Ketik kata kunci...">
        </div>

        <p id="loading-indicator" style="display:none;">Memuat data...</p>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                <tr>
                    <th>No</th>
                    <th>Category Name</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <!-- Baris diisi dinamis oleh assets/js/category.js via fetch('../data/category.json') -->
                </tbody>
            </table>
        </div>
        <footer class="footer">
            <p>&copy; 2026 Goods Office &mdash; Jobsheet 3</p>
        </footer>
    </main>
</div>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/category.js"></script>
</body>
</html>
