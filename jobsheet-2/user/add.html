<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goods Office</title>
    <link rel="stylesheet" href="/jobsheet-2/assets/css/style.css">
</head>
<body>

<div class="container">
    <aside class="sidebar">
        <h2>Goods Office</h2>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="./item">List of Items</a></li>
            <li><a href="./index.html">Daftar Anggota</a></li>
        </ul>
    </aside>

    <main class="content">
        <h1>Add User</h1>
        <br/>
        <!-- Kontainer Form -->
        <div class="form-container">
            <h2>Tambah Data Anggota</h2>
            <form action="#" method="POST">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required>
                </div>

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">Simpan Data</button>
                    <a href="./index.html" class="btn-cancel">Batal</a>
                </div>

            </form>
        </div>
    </main>
</div>

</body>
</html>
